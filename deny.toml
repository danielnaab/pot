# cargo-deny: `nix flake check` runs `bans licenses sources`.
# Advisories need the network: run `cargo deny check advisories` in `nix develop`.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# pot-container is unpublished (publish = false); check only its dependencies.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
